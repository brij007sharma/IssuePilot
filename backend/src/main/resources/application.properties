spring.application.name=issuepilot

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/issuepilot}
spring.datasource.username=${DB_USERNAME:issuepilot}
spring.datasource.password=${DB_PASSWORD:issuepilot}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}